[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "search-antigravity"
version = "0.1.0"
description = "FastMCP Full-Text Search Engine for Antigravity Session Transcripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
search-antigravity = "src.server:main"
search-antigravity-sync = "run_sync:main"

[tool.pytest.ini_options]
pythonpath = ["."]

